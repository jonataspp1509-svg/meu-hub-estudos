<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu caderno · StudyFlow</title><link rel="stylesheet" href="foco.css?v=1"><style>.notebook{display:grid;grid-template-columns:240px 1fr;gap:22px;background:white;border:1px solid #e3e7f0;border-radius:24px;padding:24px}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #e3e7f0;border-radius:12px;margin:8px 0 18px}textarea{min-height:340px;resize:vertical}.entries button{width:100%;text-align:left;margin:5px 0;background:#f3f1fa;color:#5145cd;overflow-wrap:anywhere}.editor-actions{display:flex;gap:10px;flex-wrap:wrap}#status{min-height:26px}@media(max-width:650px){.notebook{grid-template-columns:1fr}.entries{max-height:180px;overflow:auto}}</style><main><header><a class="brand" href="index.html"><b>S</b>StudyFlow</a><a href="plano.html">Meu plano →</a></header><div class="intro"><div class="eyebrow">SUAS IDEIAS, SEU ESPAÇO</div><h1>Meu caderno</h1><p>Suas anotações são privadas e ficam ligadas à sua conta Google. A chave VIP não compartilha seu caderno.</p><p id="identity">Carregando conta…</p><p id="access"></p></div><section class="notebook" id="notebook" hidden><aside><button id="newNote" disabled>Nova anotação</button><div id="entries" class="entries"></div></aside><form id="editor"><label for="noteTitle">Título</label><input id="noteTitle" maxlength="120" required disabled><label for="noteBody">Anotação</label><textarea id="noteBody" maxlength="200000" disabled placeholder="Escreva um resumo, uma dúvida ou uma ideia…"></textarea><div class="editor-actions"><button id="saveNote" disabled>Salvar anotação</button><button id="deleteNote" type="button" class="quiet" disabled>Excluir anotação</button></div><p id="status" role="status"></p></form></section></main><script type="module" src="caderno.js?v=1"></script></html>
